name: Terraform Apply

on:
  push:
    branches:
      - master

jobs:
  apply:
    runs-on: self-hosted
    steps:
      - name: Checkout
        run: |
          git clone --depth=1 --branch "${GITHUB_REF_NAME}" "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo
          echo "REPO_DIR=$PWD/repo" >> "$GITHUB_ENV"

      - name: Terraform Init
        working-directory: repo
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Apply
        working-directory: repo
        run: terraform apply -auto-approve
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          VAULT_ADDR: http://127.0.0.1:8200

      - name: Cleanup
        if: always()
        run: rm -rf repo
