name: Terraform Plan

on:
  pull_request:
    branches:
      - master

# GITHUB_TOKEN defaults to read-only; pull-requests:write is needed so the
# "Post Plan to PR" step can create a comment via the issues-comments API.
permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: self-hosted
    steps:
      - name: Checkout
        run: |
          git clone --depth=1 --branch "${GITHUB_HEAD_REF}" "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo

      - name: Terraform Init
        working-directory: repo
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Format Check
        working-directory: repo
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: repo
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: repo
        run: terraform plan -no-color 2>&1 | tee /tmp/plan.txt; exit "${PIPESTATUS[0]}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          VAULT_ADDR: http://127.0.0.1:8200

      - name: Post Plan to PR
        if: always()
        run: |
          OUTCOME="${{ steps.plan.outcome }}"
          ICON=$( [ "$OUTCOME" = "success" ] && echo "✅" || echo "❌" )
          PLAN=$(cat /tmp/plan.txt)
          if [ ${#PLAN} -gt 65000 ]; then
            PLAN="${PLAN:0:65000}"$'\n\n... output truncated'
          fi
          BODY=$(printf '## %s Terraform Plan\n\n<details><summary>Show Plan</summary>\n\n```\n%s\n```\n</details>' "$ICON" "$PLAN")
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d "$(jq -n --arg body "$BODY" '{body: $body}')"

      - name: Cleanup
        if: always()
        run: rm -rf repo
